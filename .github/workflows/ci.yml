name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Using `npm install` rather than `npm ci`: workspace versions are bumped ahead
      # of the committed lockfile, so `npm ci` would fail its integrity check. Switch
      # to `npm ci` once package-lock.json is regenerated in sync.
      - run: npm install
      # Build before typecheck/test: composite project refs and dist/ outputs must exist.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node --test packages/server/test/*.test.mjs
