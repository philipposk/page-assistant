[project]
name = "page-assistant"
version = "0.3.0"
description = "Python client for the page-assistant REST API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
page-assistant = "page_assistant.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
